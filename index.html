<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>I miei animali Preferiti</title>
    <link rel="stylesheet" href="style.css" />

    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.development.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
    ></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
      const { useState } = React;
      const { createRoot } = ReactDOM;
      const root = createRoot(document.querySelector(".lista-animali"));

      function Modal({
        title,
        content,
        show = false,
        onClose,
        onConfirm,
        value,
        onChange,
      }) {
        return (
          show &&
          ReactDOM.createPortal(
            <div className="modal-container">
              <div className="modal">
                <h2>{title}</h2>
                <input type="text" value={value} onChange={onChange} />
                <p>{content}</p>
                <button onClick={onClose}>Chiudi</button>
                <button onClick={onConfirm}>Conferma</button>
              </div>
            </div>,
            document.body,
          )
        );
      }

      const ReactApp = () => {
        const [animals, setAnimals] = useState([]);
        const [inputValue, setInputValue] = useState("");
        const [show, setShow] = useState(false);

        /*       const animalsChoices = [
              "Cane",
              "Gatto",
              "Pappagallo",
              "Cavallo",
              "Panda",
            ]; */
        return (
          /*   <>
                <button
                  onClick={() => {
                    const randomAnimal =
                      animalsChoices[
                        Math.floor(Math.random() * animalsChoices.length)
                      ];

                    setAnimals([...animals, randomAnimal]);
                  }}
                >
                  Aggiungi Animale
                </button>

                <details className="animali">
                  <ul>
                    {animals.map((a) => (
                      <li>{a}</li>
                    ))}
                  </ul>
                </details>
              </> */
          <>
            <button
              onClick={() => {
                setShow(true);
              }}
            >
              Aggiungi animale
            </button>

            <Modal
              title="I miei animali preferiti"
              content={animals}
              value={inputValue}
              onChange={(e) => setInputValue(e.target.value)}
              show={show}
              onClose={() => {
                setShow(false);
              }}
              onConfirm={() => {
                setAnimals([...animals, inputValue, ", "]);
                setInputValue("");
                setShow(false);
              }}
            />
          </>
        );
      };

      root.render(<ReactApp />);
    </script>
  </head>
  <body>
    <header>
      <h1>I miei animali Preferiti</h1>
    </header>
    <main>
      <figure>
        <img src="https://picsum.photos/400/300" alt="Immagine Casuale" />
      </figure>
      <div class="lista-animali"></div>
    </main>
    <footer>
      <p>Creato con amore da... un collega sbadato! 🐾</p>
    </footer>
  </body>
</html>
