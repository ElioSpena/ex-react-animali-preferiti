<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>I miei animali Preferiti</title>
    <link rel="stylesheet" href="style.css" />

    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.development.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
    ></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
      const { useState } = React;
      const { createRoot } = ReactDOM;
      const root = createRoot(document.querySelector(".lista-animali"));

      function Modal({
        title,
        content,
        show,
        onClose,
        onConfirm,
        value,
        onChange,
      }) {
        return (
          show &&
          ReactDOM.createPortal(
            <div className="modal-container">
              <div className="modal">
                <h2>{title}</h2>
                {content}
                <button onClick={onClose}>Chiudi</button>
                <button onClick={onConfirm}>Conferma</button>
              </div>
            </div>,
            document.body,
          )
        );
      }

      const ReactApp = () => {
        const [animals, setAnimals] = useState([]);
        const [inputValue, setInputValue] = useState("");
        const [show, setShow] = useState(false);
        const [loading, setLoading] = useState(false);
        const [error, setError] = useState("");

        const apiFetch = async () => {
          setLoading(true);
          try {
            const resp = await fetch(
              `http://localhost:3333/animals?search=${inputValue}`,
            );
            const [data] = await resp.json();

            if (!data) {
              setError("Nessun animale trovato");
            }
            const newAnimal = {
              name: data.name,
              description: data.description || "Descrizione non disponibile",
              image: data.image || null,
            };
            setAnimals([...animals, newAnimal]);
          } catch (err) {
            console.log(err);
            setError("Errore durante la ricerca dell'animale");
          } finally {
            setLoading(false);
            setInputValue("");
            setShow(false);
          }
        };

        return (
          <>
            <button
              onClick={() => {
                setShow(true);
              }}
            >
              Aggiungi animale
            </button>

            <details>
              <summary>Animali Preferiti</summary>
              {error && <p>{error}</p>}
              {animals.map((a, id) => (
                <div className="card" key={id}>
                  <h2>{a.name}</h2>

                  <p>{a.description}</p>
                  {a.image && (
                    <figure>
                      <img src={a.image} alt={a.name} />
                    </figure>
                  )}
                </div>
              ))}
            </details>
            <Modal
              title="Aggiungi animale"
              content={
                <>
                  <input
                    type="text"
                    value={inputValue}
                    onChange={(e) => setInputValue(e.target.value)}
                  />

                  {loading && <p>Caricamento...</p>}
                </>
              }
              show={show}
              onClose={() => {
                setShow(false);
              }}
              onConfirm={apiFetch}
            />
          </>
        );
      };

      root.render(<ReactApp />);
    </script>
  </head>
  <!-------->
  <body>
    <header>
      <h1>I miei animali Preferiti</h1>
    </header>
    <main>
      <figure>
        <img src="https://picsum.photos/400/300" alt="Immagine Casuale" />
      </figure>
      <div class="lista-animali"></div>
    </main>
    <footer>
      <p>Creato con amore da... un collega sbadato! 🐾</p>
    </footer>
  </body>
</html>
